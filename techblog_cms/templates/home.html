{% extends 'base.html' %}

{% block content %}
<section class="mb-6">
    <h1 class="text-2xl md:text-3xl font-bold text-gray-900">{{ blog_title }}</h1>
    <p class="text-gray-600 mt-2">{{ blog_description }}</p>
</section>

<section class="card px-5 md:px-6" aria-labelledby="latest-heading">
    <div class="flex items-center justify-between pt-5">
        <h2 id="latest-heading" class="text-sm font-bold text-gray-500 uppercase tracking-wider">新着記事</h2>
        <a href="{% url 'feed' %}" class="text-xs text-gray-500 hover:text-orange-600 inline-flex items-center gap-1"><i class="ti ti-rss" aria-hidden="true"></i>RSS</a>
    </div>
    {% for article in articles %}
        {% include 'components/article_item.html' %}
    {% empty %}
        <p class="py-10 text-center text-gray-500">まだ公開された記事はありません。</p>
    {% endfor %}
    {% if articles %}
    <div class="border-t border-gray-200 py-4 text-center">
        <a href="{% url 'article_list' %}" class="text-sm font-semibold text-blue-600 hover:text-blue-800">すべての記事を見る →</a>
    </div>
    {% endif %}
</section>
{% endblock %}
