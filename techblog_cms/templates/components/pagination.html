{% if page_obj and page_obj.paginator.num_pages > 1 %}
<nav class="mt-8 flex items-center justify-center gap-3" aria-label="ページ送り">
    {% if page_obj.has_previous %}
    <a href="{% querystring page=page_obj.previous_page_number %}" class="btn btn-secondary" rel="prev"><i class="ti ti-chevron-left" aria-hidden="true"></i>前へ</a>
    {% else %}
    <span class="btn btn-secondary opacity-50 cursor-not-allowed" aria-disabled="true"><i class="ti ti-chevron-left" aria-hidden="true"></i>前へ</span>
    {% endif %}

    <span class="text-sm text-gray-600 tabular-nums">{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span>

    {% if page_obj.has_next %}
    <a href="{% querystring page=page_obj.next_page_number %}" class="btn btn-secondary" rel="next">次へ<i class="ti ti-chevron-right" aria-hidden="true"></i></a>
    {% else %}
    <span class="btn btn-secondary opacity-50 cursor-not-allowed" aria-disabled="true">次へ<i class="ti ti-chevron-right" aria-hidden="true"></i></span>
    {% endif %}
</nav>
{% endif %}
