{% with url_name=request.resolver_match.url_name %}
<header class="site-header">
    <nav class="container mx-auto px-4 max-w-6xl" aria-label="メインナビゲーション">
        <div class="flex items-center justify-between gap-4 h-16">
            <a href="{% url 'home' %}" class="flex-shrink-0 text-xl font-bold text-gray-900 tracking-tight">
                {{ blog_title }}
            </a>

            <form action="{% url 'search' %}" method="get" role="search" class="hidden md:block relative flex-1 max-w-sm">
                <i class="ti ti-search search-icon" aria-hidden="true"></i>
                <label for="site-search" class="sr-only">記事を検索</label>
                <input type="search" id="site-search" name="q" value="{{ query|default:'' }}" placeholder="記事を検索" class="search-input text-sm">
            </form>

            <div class="hidden md:flex items-center gap-5 text-sm font-medium">
                <a href="{% url 'article_list' %}" class="nav-link" {% if url_name == 'article_list' %}aria-current="page"{% endif %}>記事</a>
                <a href="{% url 'categories' %}" class="nav-link" {% if url_name == 'categories' or url_name == 'category' %}aria-current="page"{% endif %}>カテゴリ</a>
                <a href="{% url 'tags' %}" class="nav-link" {% if url_name == 'tags' or url_name == 'tag' %}aria-current="page"{% endif %}>タグ</a>
                {% if request.user.is_authenticated %}
                <span class="w-px h-5 bg-gray-300" aria-hidden="true"></span>
                <a href="{% url 'dashboard' %}" class="nav-link" {% if url_name == 'dashboard' %}aria-current="page"{% endif %}>ダッシュボード</a>
                <a href="{% url 'article_new' %}" class="btn btn-primary btn-sm"><i class="ti ti-pencil-plus" aria-hidden="true"></i>新規作成</a>
                <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit" class="nav-link">ログアウト</button></form>
                {% endif %}
            </div>

            <button id="mobile-menu-button" type="button"
                    class="md:hidden inline-flex items-center justify-center w-10 h-10 rounded-md text-gray-700 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    aria-controls="mobile-menu" aria-expanded="false" aria-label="メニューを開く">
                <span aria-hidden="true" class="hamburger-line hamburger-line-top"></span>
                <span aria-hidden="true" class="hamburger-line hamburger-line-middle"></span>
                <span aria-hidden="true" class="hamburger-line hamburger-line-bottom"></span>
            </button>
        </div>

        <div id="mobile-menu" class="hidden md:hidden pb-4 border-t border-gray-200">
            <form action="{% url 'search' %}" method="get" role="search" class="relative mt-4">
                <i class="ti ti-search search-icon" aria-hidden="true"></i>
                <label for="mobile-search" class="sr-only">記事を検索</label>
                <input type="search" id="mobile-search" name="q" value="{{ query|default:'' }}" placeholder="記事を検索" class="search-input">
            </form>
            <div class="pt-4 flex flex-col gap-3 font-medium text-gray-700">
                <a href="{% url 'home' %}" class="hover:text-blue-600">ホーム</a>
                <a href="{% url 'article_list' %}" class="hover:text-blue-600">記事一覧</a>
                <a href="{% url 'categories' %}" class="hover:text-blue-600">カテゴリ</a>
                <a href="{% url 'tags' %}" class="hover:text-blue-600">タグ</a>
                {% if request.user.is_authenticated %}
                <hr class="border-gray-200">
                <a href="{% url 'dashboard' %}" class="hover:text-blue-600">ダッシュボード</a>
                <a href="{% url 'article_new' %}" class="hover:text-blue-600">新規作成</a>
                <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit" class="hover:text-blue-600">ログアウト</button></form>
                {% endif %}
            </div>
        </div>
    </nav>
</header>
{% endwith %}
