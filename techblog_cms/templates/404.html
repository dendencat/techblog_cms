{% extends 'base.html' %}

{% block title %}ページが見つかりません - {{ blog_title }}{% endblock %}

{% block main %}
<div class="container mx-auto px-4 py-20 text-center">
  <p class="text-6xl font-bold text-gray-300">404</p>
  <h1 class="text-xl font-bold text-gray-900 mt-4">ページが見つかりません</h1>
  <p class="text-gray-600 mt-2">URL が間違っているか、記事が削除・非公開になった可能性があります。</p>
  <div class="mt-6 flex justify-center gap-3">
    <a href="{% url 'home' %}" class="btn btn-primary">トップへ</a>
    <a href="{% url 'search' %}" class="btn btn-secondary">記事を検索</a>
  </div>
</div>
{% endblock %}
