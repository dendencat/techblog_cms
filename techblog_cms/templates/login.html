{% extends 'base.html' %}

{% block title %}ログイン - {{ blog_title }}{% endblock %}
{% block extra_head %}<meta name="robots" content="noindex">{% endblock %}

{% block main %}
<div class="container mx-auto px-4 py-12 md:py-20">
  <div class="card max-w-sm mx-auto p-6 md:p-8">
    <h1 class="text-xl font-bold text-gray-900 mb-6">管理者ログイン</h1>
    {% if error %}
    <div class="alert alert-error mb-4" role="alert">ユーザー名またはパスワードが正しくありません。</div>
    {% endif %}
    <form method="post" class="space-y-4">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next|default:'' }}">
      <div>
        <label for="username" class="form-label">ユーザー名</label>
        <input id="username" name="username" type="text" class="form-control" value="{{ username|default:'' }}" autocomplete="username" autocapitalize="none" required {% if not username %}autofocus{% endif %}>
      </div>
      <div>
        <label for="password" class="form-label">パスワード</label>
        <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required {% if username %}autofocus{% endif %}>
      </div>
      <button type="submit" class="btn btn-primary w-full">ログイン</button>
    </form>
  </div>
</div>
{% endblock %}
