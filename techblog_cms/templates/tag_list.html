{% extends 'base.html' %}

{% block title %}タグ - {{ blog_title }}{% endblock %}

{% block content %}
<header class="mb-6">
    <h1 class="text-2xl md:text-3xl font-bold text-gray-900">タグ</h1>
</header>

<section class="card p-6">
    {% if tag_list %}
    <div class="flex flex-wrap gap-3">
        {% for tag in tag_list %}
        <a href="{% url 'tag' slug=tag.slug %}" class="chip text-base px-4 py-1.5">
            #{{ tag.name }} <span class="text-gray-400 text-sm ml-1">{{ tag.num_articles }}</span>
        </a>
        {% endfor %}
    </div>
    {% else %}
    <p class="text-gray-500">タグはまだ登録されていません。</p>
    {% endif %}
</section>
{% endblock %}
