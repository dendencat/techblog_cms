[project]
name = "techblog-cms"
version = "0.1.0"
description = "Dedicated CMS for a tech blog (テックブログ専用CMS)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django==4.2.30",
    "python-decouple>=3.8,<4.0",
    "pillow>=12.1.1,<13.0",
    "pygments>=2.15,<3.0",
    "psycopg2-binary>=2.9,<3.0",
    "redis>=5.0,<6.0",
    "django-redis>=5.4,<6.0",
    "gunicorn>=23.0,<24.0",
    "requests>=2.31,<3.0",
    "pytest>=7.4,<8.0",
    "pytest-django>=4.7,<5.0",
    "pytest-cov>=4.1,<5.0",
    "playwright>=1.40,<2.0",
    "markdown>=3.5,<4.0",
    "pymdown-extensions>=10.8,<11.0",
    "linkify-it-py>=2.0,<3.0",
]

[dependency-groups]
dev = [
    "ruff>=0.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
