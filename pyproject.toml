[project]
name = "techblog-cms"
version = "0.1.0"
description = "Dedicated CMS for a tech blog (テックブログ専用CMS)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Keep in sync with requirements.txt (the Docker image installs from that file).
    "django>=5.2.18,<5.3",
    "python-decouple>=3.8,<4.0",
    "pillow>=12.1.1,<13.0",
    "pygments>=2.15,<3.0",
    "psycopg2-binary>=2.9,<3.0",
    "redis>=5.0,<6.0",
    "django-redis>=5.4,<6.0",
    "gunicorn>=23.0,<24.0",
    "requests>=2.32.4,<3.0",
    "markdown>=3.5,<4.0",
    "pymdown-extensions>=11.0.1,<13.0",
    "linkify-it-py>=2.0,<3.0",
    "nh3>=0.3,<0.4",
]

[dependency-groups]
dev = [
    # Keep in sync with requirements-dev.txt.
    "pytest>=9.0.3,<10.0",
    "pytest-django>=4.11,<5.0",
    "pytest-cov>=6.0,<8.0",
    "playwright>=1.40,<2.0",
    "pip-audit>=2.9,<3.0",
    "ruff>=0.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
